<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINDLESS — Concept Store</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-glow"></div>
    <header class="hero">
      <nav class="nav">
        <div class="logo" aria-label="Logotipo MINDLESS">(*-*)</div>
        <span class="nav-divider"></span>
        <span class="tagline">MINDLESS concept store</span>
      </nav>
      <div class="hero-content">
        <p class="eyebrow">Luxury minimalism</p>
        <h1>MINDLESS</h1>
        <p class="subtitle">achieving imperfection</p>
        <p class="description">
          Uma narrativa anual em 12 secções desbloqueadas mês a mês. Cada capítulo representa uma
          fase emocional distinta, em equilíbrio entre a precisão e o caos.
        </p>
      </div>
    </header>

    <main class="timeline" aria-label="Secções mensais">
      <div class="section-grid">
        <button class="section-card" data-month="1">
          <span class="section-number">Q1</span>
          <span class="section-title">New Life Concept</span>
        </button>
        <button class="section-card" data-month="2">
          <span class="section-number">Q2</span>
          <span class="section-title">Controlled</span>
        </button>
        <button class="section-card" data-month="3">
          <span class="section-number">Q3</span>
          <span class="section-title">Faith</span>
        </button>
        <button class="section-card" data-month="4">
          <span class="section-number">Q4</span>
          <span class="section-title">Am I a Liar?</span>
        </button>
        <button class="section-card" data-month="5">
          <span class="section-number">Q5</span>
          <span class="section-title">Time</span>
        </button>
        <button class="section-card" data-month="6">
          <span class="section-number">Q6</span>
          <span class="section-title">Equator</span>
        </button>
        <button class="section-card" data-month="7">
          <span class="section-number">Q7</span>
          <span class="section-title">Godus</span>
        </button>
        <button class="section-card" data-month="8">
          <span class="section-number">Q8</span>
          <span class="section-title">Off a Party</span>
        </button>
        <button class="section-card" data-month="9">
          <span class="section-number">Q9</span>
          <span class="section-title">ckBawards</span>
        </button>
        <button class="section-card" data-month="10">
          <span class="section-number">Q10</span>
          <span class="section-title">Anthropophagi</span>
        </button>
        <button class="section-card" data-month="11">
          <span class="section-number">Q11</span>
          <span class="section-title">Choice</span>
        </button>
        <button class="section-card" data-month="12">
          <span class="section-number">Q12</span>
          <span class="section-title">End Life Concept</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-line"></div>
      <p>© 2024 MINDLESS. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
